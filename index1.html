<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>path-to-zero | SevenStars9code</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Import Map: ブラウザにモジュールの正確な位置を教える羅針盤 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.150.1",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.78.2?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>

  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html, #root { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      background: #020617; 
      color: white; 
      overflow: hidden;
    }
    canvas { touch-action: none; display: block; }
    
    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      height: 4px;
      border-radius: 2px;
      width: 100%;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ef4444;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <!-- ロード中の画面 -->
  <div id="root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; font-family: monospace; color: #64748b; letter-spacing: 0.2em;">
      Booting 0-Navigational OS (ESM Engine)...
    </div>
  </div>

  <!-- 最新のESモジュール方式による完全なインポート -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef, Suspense } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { Stars, Sphere, OrbitControls } from '@react-three/drei';

    // --- 3D Lattice Component ---
    const Lattice3D = ({ data }) => {
      const groupRef = useRef();

      const vertices = useMemo(() => {
        const angleStep = (Math.PI * 2) / 6;
        return data.map((val, i) => {
          const theta = i * angleStep - Math.PI / 2;
          const r = 1.6; 
          const x = r * Math.cos(theta) * val;
          const y = r * Math.sin(theta) * val;
          const zSq = Math.max(0, r*r - x*x - y*y);
          const z = Math.sqrt(zSq) * (i % 2 === 0 ? 1 : -1); 
          return new THREE.Vector3(x, y, z);
        });
      }, [data]);

      // 回転アニメーション
      useFrame(() => {
        if (groupRef.current) {
          groupRef.current.rotation.y += 0.002;
          groupRef.current.rotation.x += 0.001;
        }
      });

      return (
        <group ref={groupRef}>
          <Stars radius={100} depth={50} count={5000} factor={4} saturation={0} fade speed={1} />
          <ambientLight intensity={0.7} />
          <pointLight position={[10, 10, 10]} intensity={1.5} />
          
          {/* うっすらと見える基準の球体 */}
          <Sphere args={[1.6, 32, 32]}>
            <meshStandardMaterial color="#1e293b" wireframe transparent opacity={0.1} />
          </Sphere>

          {/* 六星の頂点 */}
          {vertices.map((v, i) => (
            <mesh key={i} position={v}>
              <sphereGeometry args={[0.07, 16, 16]} />
              <meshStandardMaterial 
                color={i < 3 ? "#4ade80" : "#f87171"} 
                emissive={i < 3 ? "#4ade80" : "#f87171"} 
                emissiveIntensity={2} 
              />
            </mesh>
          ))}

          {/* 正八面体の線 */}
          <line>
            <bufferGeometry attach="geometry" setFromPoints={[...vertices, vertices[0]]} />
            <lineBasicMaterial attach="material" color="#60a5fa" transparent opacity={0.6} />
          </line>

          {/* 中心の赤い魂 */}
          <mesh>
            <sphereGeometry args={[0.15, 16, 16]} />
            <meshStandardMaterial color="#ef4444" emissive="#ef4444" emissiveIntensity={3} />
          </mesh>
        </group>
      );
    };

    // --- Main App Component ---
    const App = () => {
      const [page, setPage] = useState('intro');
      const [params, setParams] = useState({ environment: 50, action: 50, purpose: 50 });
      const [latticeData, setLatticeData] = useState([1, 1, 1, 1, 1, 1]);

      useEffect(() => {
        const { environment: e, action: a, purpose: p } = params;
        const normE = (e - 50) / 50; 
        const normA = (a - 50) / 50; 
        const normP = (p - 50) / 50;

        const p1 = Math.max(0.1, (normA + normP + 1) / 2);
        const p2 = Math.max(0.1, (normE + normA + 1) / 2);
        const p3 = Math.max(0.1, (normE + normA + normP > 1.5 ? 1.2 : (normE + normA + normP + 1.5) / 3));
        const p4 = Math.max(0.1, ((-normA) + (-normP) + 1) / 2);
        const p5 = Math.max(0.1, (normE - normA + 1) / 2);
        const p6 = Math.max(0.1, (p4 - p1 + 1) / 2);

        const raw = [p1, p2, p3, p4, p5, p6];
        const maxV = Math.max(...raw);
        setLatticeData(raw.map(v => v / (maxV || 1)));
      }, [params]);

      const getSvgPath = () => {
        const points = latticeData.map((v, i) => {
          const a = i * Math.PI / 3 - Math.PI / 2;
          return {
            x: 150 + v * 100 * Math.cos(a),
            y: 150 + v * 100 * Math.sin(a)
          };
        });
        const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x},${p.y}`).join(' ');
        return d + ' Z';
      };

      if (page === 'intro') return (
        <div className="h-full flex items-center justify-center bg-slate-950 relative cursor-pointer" onClick={() => setPage('reality')}>
          <div className="absolute inset-0 bg-gradient-to-tr from-blue-900/30 via-slate-950 to-orange-900/30"></div>
          <div className="z-10 text-center px-6">
            <h1 className="text-4xl md:text-6xl font-bold tracking-[0.3em] mb-8 animate-pulse text-white">筑波山晴れる</h1>
            <p className="text-slate-500 tracking-[0.6em] text-[10px] md:text-sm uppercase mb-20">SevenStars9code Launchpad</p>
            <p className="text-red-500 text-xs tracking-widest animate-bounce">TAP TO START YOUR FLIGHT</p>
          </div>
        </div>
      );

      return (
        <div className="h-full flex flex-col md:flex-row bg-slate-950 overflow-hidden font-sans">
          {/* 左側の操作パネル */}
          <div className="w-full md:w-80 bg-slate-900/80 backdrop-blur-xl p-8 border-r border-white/5 z-20 flex flex-col shadow-2xl overflow-y-auto">
             <div className="mb-12">
               <h2 className="text-xl font-bold tracking-tight text-white italic">path-to-zero</h2>
               <p className="text-[10px] text-red-500 tracking-[0.4em] font-bold mt-1 uppercase">Mission Control</p>
             </div>
             
             <div className="flex-1 space-y-12">
                {Object.keys(params).map(key => (
                  <div key={key}>
                    <div className="flex justify-between items-center mb-4">
                      <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">{key}</label>
                      <span className="text-xs font-mono text-red-400 bg-red-400/10 px-2 py-0.5 rounded">{params[key]}</span>
                    </div>
                    <input 
                      type="range" 
                      className="w-full cursor-pointer" 
                      value={params[key]} 
                      onChange={e => setParams({...params, [key]: parseInt(e.target.value)})} 
                    />
                  </div>
                ))}
             </div>
             
             <div className="mt-16 space-y-3 pb-8">
                <button 
                  onClick={() => setPage('reality')} 
                  className={`w-full py-4 text-[10px] tracking-[0.3em] font-black border transition-all duration-500 ${page==='reality'?'bg-white text-black border-white shadow-[0_0_20px_rgba(255,255,255,0.3)]':'border-white/10 text-slate-500 hover:border-white/30'}`}
                >
                  REALITY (2D VIEW)
                </button>
                <button 
                  onClick={() => setPage('cosmos')} 
                  className={`w-full py-4 text-[10px] tracking-[0.3em] font-black border transition-all duration-500 ${page==='cosmos'?'bg-white text-black border-white shadow-[0_0_20px_rgba(255,255,255,0.3)]':'border-white/10 text-slate-500 hover:border-white/30'}`}
                >
                  COSMOS (3D VIEW)
                </button>
             </div>
          </div>

          {/* 右側の表示エリア */}
          <div className="flex-1 relative bg-black overflow-hidden h-full">
            {page === 'reality' ? (
              <div className="flex items-center justify-center h-full">
                <svg viewBox="0 0 300 300" className="w-4/5 h-4/5 drop-shadow-[0_0_30px_rgba(239,68,68,0.2)]">
                   <g opacity="0.2">
                     <circle cx="150" cy="150" r="100" fill="none" stroke="#475569" strokeWidth="0.5" strokeDasharray="5,5" />
                     <circle cx="150" cy="150" r="50" fill="none" stroke="#475569" strokeWidth="0.5" strokeDasharray="5,5" />
                   </g>
                   <path 
                     d={getSvgPath()} 
                     fill="rgba(239, 68, 68, 0.15)" 
                     stroke="#ef4444" 
                     strokeWidth="2.5" 
                     className="transition-all duration-700 ease-out"
                   />
                   <circle cx="150" cy="150" r="5" fill="#ef4444" className="animate-pulse" />
                </svg>
                <div className="absolute top-10 right-10 text-right">
                   <p className="text-[10px] tracking-[0.4em] text-slate-600 font-black uppercase">Reality: Frontal Distortion</p>
                </div>
              </div>
            ) : (
              <div className="h-full w-full">
                <Suspense fallback={<div className="text-white">Loading Universe...</div>}>
                  <Canvas camera={{ position: [0, 0, 5], fov: 45 }}>
                    <Lattice3D data={latticeData} />
                    <OrbitControls makeDefault enableZoom={true} />
                  </Canvas>
                </Suspense>
                <div className="absolute top-10 right-10 text-right pointer-events-none">
                   <p className="text-[10px] tracking-[0.4em] text-blue-500 font-black uppercase">Cosmos: Universal Lattice</p>
                   <p className="text-[8px] text-slate-700 mt-1 italic uppercase tracking-widest">Drag to rotate the true structure</p>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // React18 の正しい起動方法
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
